name: Repository quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable model revisions
        run: python scripts/check_model_revisions.py
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned lint tool
        run: python -m pip install ruff==0.13.3
      - name: Ruff static checks
        run: python -m ruff check --select E4,E7,E9,F modal_app.py tests/ scripts/
      - name: Compile Python sources
        run: python -m compileall -q modal_app.py tests scripts
      - name: Verify serving configuration without importing Modal
        run: python scripts/check_serving_config.py modal_app.py
